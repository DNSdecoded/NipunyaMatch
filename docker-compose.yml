services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
  ui:
    build: .
    env_file: .env
    command: ["uv", "run", "streamlit", "run", "app/ui/Home.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      API_BASE_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
